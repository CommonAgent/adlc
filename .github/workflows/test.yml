name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AGENTMESH_ENV: example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Standards
        run: node --test standards/test/*.test.mjs

      - name: The lifecycle packages
        run: |
          for a in solution-architect spec-writer solution-planner test-writer code-writer code-critic publisher incident-recorder doc-writer impact-analyst security-reviewer watcher agent-auditor usability-tester; do
            echo "== $a"
            (cd agents/$a && node --test test/*.test.mjs)
          done

      - name: Each package builds into an Agent Package
        shell: bash
        run: |
          for a in solution-architect spec-writer solution-planner test-writer code-writer code-critic publisher incident-recorder doc-writer impact-analyst security-reviewer watcher agent-auditor usability-tester; do
            python3 agents/package-maker/build.py agents/$a "$RUNNER_TEMP/pkg/$a" | tail -1
          done

      - name: Package maker
        run: |
          cd agents/package-maker
          node --test connection.test.mjs request.test.mjs model-caller.test.mjs process-pack.test.mjs
          python3 -m unittest test_folder test_standing test_options test_person test_model_kind test_imports

      - name: No network address in an agent's scripts
        run: |
          git fetch --no-tags --depth=1 origin main
          node checks/addresses.mjs --base FETCH_HEAD
          node --test checks/test/*.test.mjs

      - name: Host model gateway
        run: node --test host/test/*.test.mjs

      - name: Conformance checker
        run: node --test agents/conformance-checker/test/*.test.mjs

      - name: Deployment manager
        run: |
          cd agents/deployment-manager
          python3 -m unittest discover -p "test_*.py"
          node --test "test/*.test.mjs"

      - name: Image tools
        run: node --test agents/image/test/job-usage.test.mjs agents/image/test/model-gateway.test.mjs agents/image/test/tenant-host.test.mjs agents/image/test/wake-host.test.mjs

      - name: Catalog
        run: |
          cd agents/catalog
          npm install --no-audit --no-fund
          npm test

      - name: Host templates render with the example environment
        run: |
          for t in agents/*/host/*.tmpl host/*.tmpl; do
            node env/render.mjs "$t" > /dev/null
          done
